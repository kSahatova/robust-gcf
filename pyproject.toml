[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-gcf"
version = "0.1.0"
description = "Robustness of generative counterfactual explanations for binary image classifiers"
requires-python = ">=3.8"
# `robust_gcf.core` needs only pydantic (v1 or v2), so it can be installed into every CF-method env.
dependencies = ["pydantic>=1.10"]

[project.optional-dependencies]
# Cached data + plain torch Datasets + classifier loading. Enough for any CF-method env.
data = ["numpy", "pandas", "pyarrow", "pillow"]
torch = ["torch>=1.11", "torchvision>=0.12"]
# Training/orchestration env only. Never required by CF-method envs.
train = ["lightning>=2.0", "torchmetrics>=1.0", "hydra-core>=1.3"]
medmnist = ["medmnist>=3.0"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
