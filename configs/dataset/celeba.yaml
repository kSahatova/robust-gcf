name: celeba
raw_root: ${paths.data_root}/raw/celeba
channels: 3
cache_resolution: 128   # GCD (256 px DiffAE) gets a second cache built with cache_resolution=256
crop: center            # = DiME CelebADataset: Resize(128) -> CenterCrop(128) (eval transform)
source_kwargs: {}
augment: true           # DiME train aug: hflip + RandomResizedCrop(scale=(0.95, 1.0))
