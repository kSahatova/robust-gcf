# @package _global_
defaults:
  - /dataset: chestmnist
  - _self_

target:
  name: chestmnist_effusion
  dataset: chestmnist
  column: effusion
  positive_name: Effusion
  negative_name: Healthy
  negative_policy: no_finding   # negatives = no finding at all; other-finding-only images excluded
  imbalance: pos_weight         # ~18% Effusion
